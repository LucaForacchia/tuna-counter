<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tuna Counter — Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Figtree',sans-serif;background:#F4EFE6;color:#1B2B38}
a{color:#1B2B38;text-decoration:none}a:hover{color:#B8452F}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4EFE6; display: flex; flex-direction: column; font-family: 'Figtree', sans-serif; color: #1B2B38">
<header style="display: flex; align-items: center; justify-content: space-between; padding: 44px 24px 8px 24px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.5px">Tuna Counter</div>
<div style="font-size: 14px; color: #5A6670">Your tuna pantry</div>
</div>
<a href="Backup.dc.html" aria-label="Backup and settings" style="width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; border: 1px solid #E2DACB; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
</a>
</header>

<main style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding: 0 24px">
<div style="width: 272px; height: 272px; border-radius: 136px; background: #E7DFD1; display: flex; align-items: center; justify-content: center">
<div style="width: 244px; height: 244px; border-radius: 122px; background: #FFFFFF; border: 10px solid #D9CFBE; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center">
<div style="width: 64px; height: 10px; border-radius: 5px; background: #D9CFBE; margin-bottom: 14px"></div>
<div aria-live="polite" style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 104px; line-height: 1; letter-spacing: -4px; color: #1B2B38">{{count}}</div>
<div style="font-size: 15px; font-weight: 600; color: #5A6670; margin-top: 6px">{{label}}</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 28px">
<button onClick="{{dec}}" aria-label="Use one can" style="width: 128px; height: 128px; border-radius: 64px; border: none; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(27,43,56,0.18)">
<svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"></path></svg>
</button>
<a href="Modifica.dc.html" aria-label="Adjust quantity" style="width: 88px; height: 88px; border-radius: 44px; border: 1.5px solid #1B2B38; background: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0px">
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px; line-height: 1">± n</span>
<span style="font-size: 12px; font-weight: 600; color: #5A6670; margin-top: 4px">Adjust</span>
</a>
</div>
<div style="font-size: 14px; color: #5A6670; margin-top: -18px">Tap − when you open a can</div>

<div style="width: 100%; box-sizing: border-box; background: #FFFFFF; border: 1px solid #E2DACB; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 13px; color: #5A6670">Last change</div>
<div style="font-size: 16px; font-weight: 600">{{lastDelta}} · {{lastWhen}}</div>
</div>
<a href="Storico.dc.html" style="font-size: 15px; font-weight: 700; color: #B8452F; padding: 12px 4px">History →</a>
</div>
</main>

<nav aria-label="Main navigation" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0px; background: #FFFFFF; border-top: 1px solid #E2DACB; padding: 8px 12px 24px 12px">
<a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 700; color: #1B2B38">
<span style="width: 64px; height: 32px; border-radius: 16px; background: #F1D9CF; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="7" rx="8" ry="3"></ellipse><path d="M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7"></path></svg></span>
Pantry</a>
<a href="Storico.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 500; color: #5A6670">
<span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"></path><path d="M7 15l4-4 3 3 5-6"></path></svg></span>
History</a>
<a href="Backup.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; font-size: 12px; font-weight: 500; color: #5A6670">
<span style="width: 64px; height: 32px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg></span>
Backup</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B8452F","options":["#B8452F","#1F5F8B","#8A5A12"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { count: 10, lastDelta: '−1', lastWhen: 'today, 12:40' };
  }
  now() {
    var d = new Date();
    var m = d.getMinutes();
    return 'today, ' + d.getHours() + ':' + (m < 10 ? '0' + m : m);
  }
  renderVals() {
    var self = this;
    var c = this.state.count;
    return {
      accent: this.props.accent ?? '#B8452F',
      count: c,
      label: c === 1 ? 'can' : 'cans',
      lastDelta: this.state.lastDelta,
      lastWhen: this.state.lastWhen,
      dec: function () { if (c > 0) self.setState({ count: c - 1, lastDelta: '−1', lastWhen: self.now() }); }
    };
  }
}
</script>
</body>
</html>
